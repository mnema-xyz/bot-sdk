name: Publish

# A push to main whose package.json names a version npm does not have yet
# publishes it: the full check, then `npm publish` through npm's trusted
# publishing (OIDC, no token; provenance is attached), then the tag vX.Y.Z and
# its GitHub release. The trusted publisher on npmjs.com is registered for
# mnema-xyz/bot-sdk-js, workflow publish.yml, no environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No registry-url: it would write an .npmrc with a placeholder token;
          # trusted publishing authenticates through OIDC instead.
          node-version: 24

      - name: Is this version new?
        id: version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          grep -Eq "^export const VERSION = '${version//./\\.}'\$" src/version.ts || { echo "::error::src/version.ts does not say $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@mnema-xyz/bot-sdk@$version" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$version is on npm already: nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm supports trusted publishing
        if: steps.version.outputs.new == 'true'
        run: |
          set -euo pipefail
          v="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix tools/lint ci --no-audit --no-fund

      - name: Check
        if: steps.version.outputs.new == 'true'
        run: npm run check

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: npm publish --provenance --access public

      - name: Tag and GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md)"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "${notes}

          npm: https://www.npmjs.com/package/@mnema-xyz/bot-sdk/v/$VERSION"
